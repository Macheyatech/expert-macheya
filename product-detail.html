<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Detay pwodwi sou macheya.">

    <title>Pwodwi | macheya</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --orange: #f97316;
            --orange-dark: #ea580c;
            --navy: #111827;
            --cream: #fffaf5;
            --white: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #dc2626;
        }


        body {
            font-family: "Poppins", sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .detail-header {
            height: 72px;
            background: var(--white);
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            position: sticky;
            top: 0;
            z-index: 10;
        }


        .back-button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: #f3f4f6;

            color: var(--navy);

            font-size: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
        }


        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: var(--orange);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 20px;
        }


        .brand-name {
            font-size: 22px;
            font-weight: 700;
        }


        .header-space {
            width: 44px;
        }


        /* =========================
           PAGE
        ========================= */

        .detail-page {
            max-width: 1000px;
            margin: 30px auto;

            padding: 0 18px 50px;
        }


        .product-card {
            background: var(--white);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           IMAGE
        ========================= */

        .product-image-container {
            width: 100%;
            background: #f3f4f6;
        }


        .product-image {
            width: 100%;
            height: 460px;

            object-fit: contain;

            display: block;
        }


        /* =========================
           CONTENT
        ========================= */

        .product-content {
            padding: 28px;
        }


        .product-category {
            display: inline-block;

            color: var(--orange);

            font-size: 13px;

            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 8px;
        }


        .product-name {
            font-size: 32px;

            line-height: 1.25;

            margin-bottom: 10px;
        }


        .product-price {
            color: var(--orange);

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 22px;
        }


        .description-title {
            font-size: 18px;

            margin-bottom: 8px;
        }


        .product-description {
            color: var(--muted);

            line-height: 1.8;

            white-space: pre-line;

            margin-bottom: 25px;
        }


        /* =========================
           SELLER
        ========================= */

        .seller-box {
            border-top: 1px solid var(--border);

            border-bottom: 1px solid var(--border);

            padding: 18px 0;

            margin-bottom: 25px;
        }


        .seller-label {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 4px;
        }


        .seller-name {
            font-weight: 700;

            font-size: 17px;
        }


        /* =========================
           TYPE / STOCK
        ========================= */

        .product-info {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 25px;
        }


        .info-badge {
            background: #fff7ed;

            color: var(--orange-dark);

            border-radius: 10px;

            padding: 8px 12px;

            font-size: 13px;

            font-weight: 600;
        }


        /* =========================
           BUY
        ========================= */

        .buy-button {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 16px;

            background: var(--orange);

            color: white;

            font-family: inherit;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .buy-button:hover {
            background: var(--orange-dark);
        }
