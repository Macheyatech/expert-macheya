<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Detay pwodwi sou macheya."
    >

    <title>Pwodwi | macheya</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --orange: #f97316;
            --orange-dark: #ea580c;

            --navy: #111827;

            --cream: #fffaf5;

            --white: #ffffff;

            --text: #111827;

            --muted: #6b7280;

            --border: #e5e7eb;

            --danger: #dc2626;

        }


        body {

            font-family:
                "Poppins",
                sans-serif;

            background:
                var(--cream);

            color:
                var(--text);

            min-height:
                100vh;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .detail-header {

            height:
                72px;

            background:
                var(--white);

            border-bottom:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 20px;

            position:
                sticky;

            top:
                0;

            z-index:
                10;
        }


        .back-button {

            width:
                44px;

            height:
                44px;

            border:
                none;

            border-radius:
                50%;

            background:
                #f3f4f6;

            color:
                var(--navy);

            font-size:
                24px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-decoration:
                none;

            cursor:
                pointer;
        }


        .header-brand {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;
        }


        .logo {

            width:
                42px;

            height:
                42px;

            border-radius:
                50%;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            color:
                white;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-weight:
                800;

            font-size:
                20px;
        }


        .brand-name {

            font-size:
                22px;

            font-weight:
                700;
        }


        .header-space {

            width:
                44px;
        }


        /* ==================================================
           PAGE
        ================================================== */

        .detail-page {

            max-width:
                1000px;

            margin:
                30px auto;

            padding:
                0 18px 50px;
        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading {

            min-height:
                400px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                15px;

            color:
                var(--muted);
        }


        .spinner {

            width:
                42px;

            height:
                42px;

            border:
                4px solid #fed7aa;

            border-top-color:
                var(--orange);

            border-radius:
                50%;

            animation:
                spin
                .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* ==================================================
           PRODUCT CARD
        ================================================== */

        .product-card {

            background:
                var(--white);

            border-radius:
                24px;

            overflow:
                hidden;

            box-shadow:
                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        /* ==================================================
           IMAGE
        ================================================== */

        .product-image-container {

            width:
                100%;

            background:
                #f3f4f6;
        }


        .product-image {

            width:
                100%;

            height:
                460px;

            object-fit:
                contain;

            display:
                block;
        }


        /* ==================================================
           CONTENT
        ================================================== */

        .product-content {

            padding:
                28px;
        }


        .product-category {

            display:
                inline-block;

            color:
                var(--orange);

            font-size:
                13px;

            font-weight:
                700;

            text-transform:
                uppercase;

            margin-bottom:
                8px;
        }


        .product-name {

            font-size:
                32px;

            line-height:
                1.25;

            margin-bottom:
                10px;
        }


        .product-price {

            color:
                var(--orange);

            font-size:
                27px;

            font-weight:
                700;

            margin-bottom:
                22px;
        }


        .description-title {

            font-size:
                18px;

            margin-bottom:
                8px;
        }


        .product-description {

            color:
                var(--muted);

            line-height:
                1.8;

            white-space:
                pre-line;

            margin-bottom:
                25px;
        }


        /* ==================================================
           SELLER
        ================================================== */

        .seller-box {

            border-top:
                1px solid var(--border);

            border-bottom:
                1px solid var(--border);

            padding:
                18px 0;

            margin-bottom:
                25px;
        }


        .seller-label {

            color:
                var(--muted);

            font-size:
                14px;

            margin-bottom:
                4px;
        }


        .seller-name {

            font-weight:
                700;

            font-size:
                17px;
        }


        /* ==================================================
           TYPE / STOCK
        ================================================== */

        .product-info {

            display:
                flex;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-bottom:
                25px;
        }


        .info-badge {

            background:
                #fff7ed;

            color:
                var(--orange-dark);

            border-radius:
                10px;

            padding:
                8px 12px;

            font-size:
                13px;

            font-weight:
                600;
        }


        .stock-badge {

            background:
                #ecfdf5;

            color:
                #047857;
        }


        .out-stock {

            background:
                #fef2f2;

            color:
                var(--danger);
        }


        /* ==================================================
           BUY
        ================================================== */

        .buy-button {

            width:
                100%;

            border:
                none;

            border-radius:
                14px;

            padding:
                16px;

            background:
                linear-gradient(
                    135deg,
                    var(--orange),
                    var(--orange-dark)
                );

            color:
                white;

            font-family:
                inherit;

            font-size:
                17px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                .2s;
        }


        .buy-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 20px
                rgba(
                    249,
                    115,
                    22,
                    .20
                );
        }


        .buy-button:disabled {

            background:
                #d1d5db;

            cursor:
                not-allowed;

            box-shadow:
                none;

            transform:
                none;
        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-section {

            min-height:
                400px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                30px;
        }


        .error-icon {

            font-size:
                50px;

            margin-bottom:
                15px;
        }


        .error-section h2 {

            font-size:
                25px;

            margin-bottom:
                8px;
        }


        .error-section p {

            color:
                var(--muted);

            max-width:
                500px;

            line-height:
                1.6;

            margin-bottom:
                20px;
        }


        .back-marketplace {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                12px 18px;

            border-radius:
                12px;

            background:
                var(--orange);

            color:
                white;

            font-weight:
                700;

            text-decoration:
                none;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 600px
        ) {

            .detail-header {

                height:
                    66px;

                padding:
                    0 14px;
            }


            .brand-name {

                font-size:
                    19px;
            }


            .logo {

                width:
                    38px;

                height:
                    38px;

                font-size:
                    18px;
            }


            .detail-page {

                margin:
                    18px auto;

                padding:
                    0 12px 35px;
            }


            .product-card {

                border-radius:
                    18px;
            }


            .product-image {

                height:
                    320px;
            }


            .product-content {

                padding:
                    22px 18px;
            }


            .product-name {

                font-size:
                    26px;
            }


            .product-price {

                font-size:
                    23px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="detail-header">

        <a
            href="products.html"
            class="back-button"
            aria-label="Retounen"
        >
            ←
        </a>


        <div class="header-brand">

            <span class="logo">
                M
            </span>

            <span class="brand-name">
                macheya
            </span>

        </div>


        <div class="header-space"></div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="detail-page">


        <!-- LOADING -->

        <section
            id="loadingSection"
            class="loading"
        >

            <div class="spinner"></div>

            <p>
                N ap chaje pwodwi a...
            </p>

        </section>



        <!-- PRODUCT -->

        <section
            id="productSection"
            class="product-card"
            hidden
        >

            <div class="product-image-container">

                <img
                    id="productImage"
                    class="product-image"
                    alt="Foto pwodwi"
                >

            </div>


            <div class="product-content">

                <span
                    id="productCategory"
                    class="product-category"
                >
                    Kategori
                </span>


                <h1
                    id="productName"
                    class="product-name"
                >
                    Pwodwi
                </h1>


                <div
                    id="productPrice"
                    class="product-price"
                >
                    0 HTG
                </div>


                <h2 class="description-title">
                    Deskripsyon
                </h2>


                <p
                    id="productDescription"
                    class="product-description"
                >
                    —
                </p>



                <!-- SELLER -->

                <div class="seller-box">

                    <div class="seller-label">
                        Vandè
                    </div>


                    <div
                        id="sellerName"
                        class="seller-name"
                    >
                        —
                    </div>

                </div>



                <!-- TYPE / STOCK -->

                <div
                    id="productInfo"
                    class="product-info"
                ></div>



                <!-- BUY -->

                <button
                    id="buyButton"
                    class="buy-button"
                    type="button"
                >
                    Achte pwodwi sa
                </button>

            </div>

        </section>



        <!-- ERROR -->

        <section
            id="errorSection"
            class="error-section"
            hidden
        >

            <div class="error-icon">
                ⚠️
            </div>


            <h2>
                Pwodwi a pa disponib
            </h2>


            <p id="errorMessage">
                Nou pa kapab jwenn pwodwi sa a.
            </p>


            <a
                href="products.html"
                class="back-marketplace"
            >
                Retounen sou macheya
            </a>

        </section>

    </main>



    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.config.js"></script>


    <!-- ==================================================
         PRODUCT DETAIL JS
    ================================================== -->

    <script src="product-detail.js"></script>


</body>

    </html>
