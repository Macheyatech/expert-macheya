<!DOCTYPE html>
<html lang="ht">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Ajoute yon nouvo pwodwi sou Macheya.">

    <title>Ajoute pwodwi | Macheya</title>

    <link
        rel="stylesheet"
        href="addproduct.css">
</head>


<body>

<header class="add-header">

    <a
        href="dashboard.html"
        class="back-button">
        ←
    </a>

    <div class="header-brand">

        <span class="logo">
            M
        </span>

        <span class="brand-name">
            macheya
        </span>

    </div>

</header>


<main class="add-product-page">


    <!-- =====================================================
         TIT
    ====================================================== -->

    <section class="page-heading">

        <span class="heading-label">
            ESPAS VANDÈ
        </span>

        <h1>
            Ajoute yon pwodwi
        </h1>

        <p>
            Mete pwodwi ou a sou Macheya pou kliyan yo ka dekouvri li.
        </p>

    </section>


    <!-- =====================================================
         FORM
    ====================================================== -->

    <section class="product-form-card">

        <form
            id="productForm"
            enctype="multipart/form-data">


            <!-- =================================================
                 FOTO PRODUIT
            ================================================== -->

            <div class="form-section">

                <label class="form-label">
                    Foto pwodwi
                </label>


                <div
                    id="imageUpload"
                    class="image-upload"
                    role="button"
                    tabindex="0">


                    <div
                        id="imagePlaceholder"
                        class="image-placeholder">

                        <span class="upload-icon">
                            📷
                        </span>

                        <strong>
                            Ajoute foto pwodwi a
                        </strong>

                        <small>
                            Chwazi yon foto nan telefòn ou
                        </small>

                    </div>


                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Aperçu pwodwi"
                        style="display:none;">

                </div>


                <!-- INPUT FOTO -->

                <input
                    type="file"
                    id="productImage"
                    name="product_image"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    hidden>


                <!-- BOUTON FOTO -->

                <button
                    type="button"
                    id="chooseImageButton"
                    class="secondary-button">

                    Chwazi foto

                </button>


                <p
                    id="imageError"
                    class="field-error">
                </p>

            </div>


            <!-- =================================================
                 NON PRODUIT
            ================================================== -->

            <div class="form-section">

                <label
                    for="productName"
                    class="form-label">

                    Non pwodwi

                </label>


                <input
                    type="text"
                    id="productName"
                    name="name"
                    placeholder="Egzanp: T-shirt Macheya"
                    maxlength="150"
                    required>

            </div>


            <!-- =================================================
                 PRI + STOCK
            ================================================== -->

            <div class="form-row">


                <!-- PRI -->

                <div class="form-section">

                    <label
                        for="productPrice"
                        class="form-label">

                        Pri (HTG)

                    </label>


                    <input
                        type="number"
                        id="productPrice"
                        name="price"
                        placeholder="2500"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <!-- STOCK -->

                <div class="form-section">

                    <label
                        for="productStock"
                        class="form-label">

                        Stock

                    </label>


                    <input
                        type="number"
                        id="productStock"
                        name="stock"
                        placeholder="10"
                        min="0"
                        step="1"
                        required>

                </div>

            </div>


            <!-- =================================================
                 KATEGORI
            ================================================== -->

            <div class="form-section">

                <label
                    for="productCategory"
                    class="form-label">

                    Kategori

                </label>


                <select
                    id="productCategory"
                    name="category"
                    required>

                    <option value="">
                        Chwazi kategori
                    </option>

                    <option value="Rad">
                        Rad
                    </option>

                    <option value="Soulye">
                        Soulye
                    </option>

                    <option value="Akseswa">
                        Akseswa
                    </option>

                    <option value="Elektronik">
                        Elektronik
                    </option>

                    <option value="Kay">
                        Kay
                    </option>

                    <option value="Bote">
                        Bote
                    </option>

                    <option value="Manje">
                        Manje
                    </option>

                    <option value="Sèvis">
                        Sèvis
                    </option>

                    <option value="Lòt">
                        Lòt
                    </option>

                </select>

            </div>


            <!-- =================================================
                 TYPE PRODUIT
            ================================================== -->

            <div class="form-section">

                <label
                    for="productType"
                    class="form-label">

                    Kalite pwodwi

                </label>


                <select
                    id="productType"
                    name="product_type"
                    required>

                    <option value="">
                        Chwazi kalite
                    </option>

                    <option value="physical">
                        Pwodwi fizik
                    </option>

                    <option value="digital">
                        Pwodwi dijital
                    </option>

                    <option value="service">
                        Sèvis
                    </option>

                </select>

            </div>


            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <div class="form-section">

                <label
                    for="productDescription"
                    class="form-label">

                    Deskripsyon

                </label>


                <textarea
                    id="productDescription"
                    name="description"
                    rows="6"
                    maxlength="5000"
                    placeholder="Dekri pwodwi ou a..."
                    required></textarea>

            </div>


            <!-- =================================================
                 FICHYE DIJITAL
            ================================================== -->

            <div
                id="digitalFileSection"
                class="form-section"
                style="display:none;">

                <label
                    for="digitalFile"
                    class="form-label">

                    Fichye pwodwi dijital

                </label>


                <input
                    type="file"
                    id="digitalFile"
                    name="digital_file"
                    accept=".pdf,.zip,.rar,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.epub,.mp4,.mp3,.png,.jpg,.jpeg">


                <p class="form-help">

                    Fichye sa a ap ale nan espas prive
                    pwodwi dijital Macheya a.

                </p>


                <p
                    id="digitalFileError"
                    class="field-error">
                </p>

            </div>


            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="formMessage"
                class="form-message"
                style="display:none;">
            </div>


            <!-- =================================================
                 PUBLISH
            ================================================== -->

            <button
                type="submit"
                id="publishButton"
                class="publish-button">

                Pibliye pwodwi

            </button>


        </form>

    </section>

</main>


<!-- =========================================================
     SUPABASE
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="addproduct.js"></script>


</body>

    </html>
