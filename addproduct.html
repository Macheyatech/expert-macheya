<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Ajoute yon nouvo pwodwi sou Macheya.">

    <title>Ajoute pwodwi | Macheya</title>

    <link
        rel="stylesheet"
        href="addproduct.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="add-header">

    <a
        href="dashboard.html"
        class="back-button"
        aria-label="Retounen">

        ←

    </a>


    <div class="header-brand">

        <span class="logo">
            M
        </span>

        <span class="brand-name">
            macheya
        </span>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="add-product-page">


    <section class="page-heading">

        <span class="heading-label">
            ESPAS VANDÈ
        </span>

        <h1>
            Ajoute yon pwodwi
        </h1>

        <p>
            Mete pwodwi ou a sou Macheya pou kliyan yo
            ka dekouvri li.
        </p>

    </section>



    <!-- =====================================================
         FORM
    ====================================================== -->

    <section class="product-form-card">

        <form
            id="productForm"
            novalidate>


            <!-- =================================================
                 FOTO PRODUIT
            ================================================== -->

            <div class="form-section">

                <label class="form-label">
                    Foto pwodwi
                </label>


                <div
                    id="imageUpload"
                    class="image-upload"
                    role="button"
                    tabindex="0"
                    aria-label="Chwazi foto pwodwi">


                    <div
                        id="imagePlaceholder"
                        class="image-placeholder">

                        <span class="upload-icon">
                            📷
                        </span>

                        <strong>
                            Ajoute foto pwodwi a
                        </strong>

                        <small>
                            JPG, PNG, WEBP oswa GIF
                            · Maksimòm 5 MB
                        </small>

                    </div>


                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Aperçu foto pwodwi"
                        style="display:none;">

                </div>


                <input
                    type="file"
                    id="productImage"
                    name="product_image"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    hidden>


                <button
                    type="button"
                    id="chooseImageButton"
                    class="secondary-button">

                    Chwazi foto

                </button>


                <p
                    id="imageError"
                    class="field-error">
                </p>

            </div>



            <!-- =================================================
                 NON
            ================================================== -->

            <div class="form-section">

                <label
                    for="productName"
                    class="form-label">

                    Non pwodwi

                </label>


                <input
                    type="text"
                    id="productName"
                    name="name"
                    maxlength="150"
                    placeholder="Egzanp: T-shirt Macheya"
                    autocomplete="off"
                    required>


                <p
                    id="nameError"
                    class="field-error">
                </p>

            </div>



            <!-- =================================================
                 PRI + STOCK
            ================================================== -->

            <div class="form-row">


                <div class="form-section">

                    <label
                        for="productPrice"
                        class="form-label">

                        Pri (HTG)

                    </label>


                    <input
                        type="number"
                        id="productPrice"
                        name="price"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="2500"
                        required>


                    <p
                        id="priceError"
                        class="field-error">
                    </p>

                </div>



                <div class="form-section">

                    <label
                        for="productStock"
                        class="form-label">

                        Stock

                    </label>


                    <input
                        type="number"
                        id="productStock"
                        name="stock"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="10"
                        value="0"
                        required>


                    <p
                        id="stockError"
                        class="field-error">
                    </p>

                </div>

            </div>



            <!-- =================================================
                 KATEGORI
            ================================================== -->

            <div class="form-section">
    <label for="productCategory" class="form-label">
        Kategori
    </label>

    <select id="productCategory" name="category" required>
        <option value="">Chwazi kategori</option>
        <option value="mode">👕 Mode (Rad & akseswa)</option>
        <option value="electronique">📱 Elektwonik</option>
        <option value="maison">🏠 Kay</option>
        <option value="beaute">✨ Bote</option>
        <option value="digital">📄 Dijital</option>
        <option value="lot">••• Lòt</option>
    </select>

    <p id="categoryError" class="field-error"></p>
            </div>
                

            </div>



            <!-- =================================================
                 TYPE PRODUIT
            ================================================== -->

            <div class="form-section">

                <label
                    for="productType"
                    class="form-label">

                    Kalite pwodwi

                </label>


                <select
                    id="productType"
                    name="product_type"
                    required>

                    <option value="">
                        Chwazi kalite
                    </option>

                    <option value="physical">
                        📦 Pwodwi fizik
                    </option>

                    <option value="digital">
                        💻 Pwodwi dijital
                    </option>

                    <option value="service">
                        🛠️ Sèvis
                    </option>

                </select>


                <p
                    id="typeError"
                    class="field-error">
                </p>

            </div>



            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <div class="form-section">

                <label
                    for="productDescription"
                    class="form-label">

                    Deskripsyon

                </label>


                <textarea
                    id="productDescription"
                    name="description"
                    rows="6"
                    maxlength="5000"
                    placeholder="Dekri pwodwi ou a..."
                    required></textarea>


                <div class="character-counter">

                    <span id="descriptionCounter">
                        0
                    </span>

                    / 5000

                </div>


                <p
                    id="descriptionError"
                    class="field-error">
                </p>

            </div>



            <!-- =================================================
                 DIGITAL FILE
            ================================================== -->

            <div
                id="digitalFileSection"
                class="form-section digital-section"
                style="display:none;">


                <div class="digital-heading">

                    <span class="digital-icon">
                        📄
                    </span>

                    <div>

                        <strong>
                            Fichye pwodwi dijital
                        </strong>

                        <small>
                            Fichye sa a ap estoke nan
                            espas prive Macheya.
                        </small>

                    </div>

                </div>


                <label
                    for="digitalFile"
                    id="digitalFilePicker"
                    class="digital-file-picker">

                    <span class="digital-file-icon">
                        📁
                    </span>

                    <span>

                        <strong>
                            Chwazi fichye a
                        </strong>

                        <small>
                            PDF, ZIP, MP4, MP3, DOCX,
                            elatriye.
                        </small>

                    </span>

                </label>


                <input
                    type="file"
                    id="digitalFile"
                    name="digital_file"
                    hidden>


                <div
                    id="digitalFileInfo"
                    class="digital-file-info"
                    style="display:none;">

                </div>


                <p
                    id="digitalFileError"
                    class="field-error">
                </p>

            </div>



            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div
                id="formMessage"
                class="form-message"
                style="display:none;">
            </div>



            <!-- =================================================
                 PUBLISH
            ================================================== -->

            <button
                type="submit"
                id="publishButton"
                class="publish-button">

                <span class="button-text">
                    Pibliye pwodwi
                </span>

            </button>


        </form>

    </section>

</main>



<!-- =========================================================
     SUPABASE
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script
    src="supabase-config.js">
</script>


<script
    src="addproduct.js">
</script>


</body>

                    </html>
