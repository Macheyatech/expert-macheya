<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin | macheya</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Poppins,Arial,sans-serif;
background:#f6f7f9;
color:#171717;
}
button,input{font:inherit}
.hidden{display:none!important}

.login{
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
}

.card{
width:min(400px,100%);
background:#fff;
padding:28px;
border-radius:20px;
box-shadow:0 10px 35px #00000012;
}

.logo{
width:55px;
height:55px;
border-radius:50%;
background:#f97316;
color:white;
display:grid;
place-items:center;
font-size:24px;
font-weight:700;
margin:auto auto 15px;
}

h1{
text-align:center;
font-size:24px;
margin-bottom:6px;
}

.subtitle{
text-align:center;
color:#777;
font-size:13px;
margin-bottom:25px;
}

label{
display:block;
font-size:12px;
font-weight:600;
margin:14px 0 6px;
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

input:focus{
border-color:#f97316;
}

.btn{
width:100%;
border:0;
padding:13px;
border-radius:10px;
background:#f97316;
color:#fff;
font-weight:700;
margin-top:18px;
cursor:pointer;
}

.message{
margin-top:15px;
font-size:12px;
text-align:center;
color:#d00;
}

.admin{
display:none;
}

header{
background:#fff;
padding:15px 5%;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
}

.brand{
font-size:20px;
font-weight:700;
}

.badge{
background:#fff7ed;
color:#f97316;
padding:8px 12px;
border-radius:20px;
font-size:11px;
font-weight:700;
}

.container{
width:min(1100px,92%);
margin:25px auto 60px;
}

h2{
font-size:25px;
margin-bottom:5px;
}

.desc{
color:#777;
font-size:13px;
margin-bottom:22px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 5px 20px #00000008;
}

.stat span{
font-size:12px;
color:#777;
}

.stat strong{
display:block;
font-size:20px;
margin-top:6px;
}

.panel{
background:#fff;
padding:20px;
border-radius:16px;
margin-top:18px;
box-shadow:0 5px 20px #00000008;
}

.actions{
display:grid;
gap:10px;
}

.action{
border:0;
padding:13px;
border-radius:10px;
background:#f97316;
color:#fff;
font-weight:700;
text-align:left;
}

.action.gray{
background:#f5f5f5;
color:#333;
}

@media(max-width:700px){
.grid{grid-template-columns:1fr 1fr}
}

@media(max-width:400px){
.card{padding:22px}
}
</style>
</head>

<body>

<div id="loginPage" class="login">

<div class="card">

<div class="logo">M</div>

<h1>Super Admin</h1>

<p class="subtitle">
Konekte pou antre nan zòn administrasyon macheya.
</p>

<form id="loginForm">

<label>Email Super Admin</label>

<input
id="email"
type="email"
placeholder="admin@macheya.com"
required
>

<label>Modpas</label>

<input
id="password"
type="password"
placeholder="••••••••"
required
>

<button
id="loginButton"
class="btn"
type="submit"
>
Konekte
</button>

</form>

<div id="message" class="message"></div>

</div>

</div>


<div id="adminPage" class="admin">

<header>

<div class="brand">Ⓜ macheya</div>

<div class="badge">🔐 SUPER ADMIN</div>

</header>

<main class="container">

<h2>Dashboard Super Admin</h2>

<p class="desc">
Kontwòl ak siveyans macheya.
</p>

<section class="grid">

<div class="stat">
<span>💰 Lajan ki sikile</span>
<strong id="circulation">0 HTG</strong>
</div>

<div class="stat">
<span>👤 Achtè</span>
<strong id="buyers">0 HTG</strong>
</div>

<div class="stat">
<span>🏪 Vandè</span>
<strong id="sellers">0 HTG</strong>
</div>

<div class="stat">
<span>💸 Frè Macheya</span>
<strong id="fees">0 HTG</strong>
</div>

<div class="stat">
<span>➕ Deposits</span>
<strong id="deposits">0 HTG</strong>
</div>

<div class="stat">
<span>➖ Retrè</span>
<strong id="withdrawals">0 HTG</strong>
</div>

<div class="stat">
<span>👥 Itilizatè</span>
<strong id="users">0</strong>
</div>

<div class="stat">
<span>📦 Kòmand</span>
<strong id="orders">0</strong>
</div>

</section>

<section class="panel">

<h3>⚡ Aksyon rapid</h3>

<div class="actions">

<button
class="action"
onclick="location.href='admin-wallet.html'"
>
💳 Jesyon Wallet
</button>

<button
class="action gray"
onclick="location.href='admin-settings.html'"
>
⚙️ Paramèt Macheya
</button>

<button
id="logout"
class="action gray"
>
🚪 Dekonekte
</button>

</div>

</section>

</main>
    </div>
    <script>
"use strict";

const sb = window.supabaseClient;

const loginPage = document.getElementById("loginPage");
const adminPage = document.getElementById("adminPage");
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

function showMessage(text) {
    message.textContent = text;
}

function money(n) {
    return new Intl.NumberFormat("fr-FR").format(
        Number(n || 0)
    ) + " HTG";
}

async function verifyAdmin() {

    if (!sb) {
        showMessage("Supabase pa konekte.");
        return false;
    }

    const {
        data: { user },
        error
    } = await sb.auth.getUser();

    if (error || !user) {
        return false;
    }

    const {
        data,
        error: adminError
    } = await sb
        .from("super_admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError) {
        console.error(adminError);
        showMessage("Erè verifikasyon Super Admin.");
        return false;
    }

    if (!data) {
        await sb.auth.signOut();
        showMessage("Kont sa a pa Super Admin.");
        return false;
    }

    loginPage.classList.add("hidden");
    adminPage.style.display = "block";

    return true;
}

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    if (!sb) {
        showMessage("Supabase pa disponib.");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Koneksyon...";

    showMessage("");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const {
        error
    } = await sb.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {

        console.error(error);

        showMessage(
            "Email oswa modpas la pa kòrèk."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Konekte";

        return;
    }

    const ok = await verifyAdmin();

    if (!ok) {
        loginButton.disabled = false;
        loginButton.textContent = "Konekte";
        return;
    }

    loadStats();
});

async function loadStats() {

    /*
      Pou kounye a nou kite estatistik yo
      sou 0 pou nou pa depann de lòt tab yo.
      Aksè Super Admin lan se pati prensipal la.
    */

    document.getElementById("circulation").textContent =
        money(0);

    document.getElementById("buyers").textContent =
        money(0);

    document.getElementById("sellers").textContent =
        money(0);

    document.getElementById("fees").textContent =
        money(0);

    document.getElementById("deposits").textContent =
        money(0);

    document.getElementById("withdrawals").textContent =
        money(0);

    document.getElementById("users").textContent = "0";

    document.getElementById("orders").textContent = "0";
}

document.getElementById("logout").onclick =
    async function() {

        await sb.auth.signOut();

        adminPage.style.display = "none";
        loginPage.classList.remove("hidden");

        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

        showMessage("Ou dekonekte.");
    };

(async function() {

    const ok = await verifyAdmin();

    if (ok) {
        loadStats();
    }

})();
</script>

</body>
    </html>
