<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kreye Kont | Macheya</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <div class="logo">
        <div class="logo-circle">M</div>
        <h1>Macheya</h1>
      </div>

      <h2>Kreye Kont</h2>

      <p class="auth-subtitle">
        Kreye kont ou pou kòmanse sou Macheya.
      </p>

      <form id="signupForm">

        <div class="form-group">
          <label for="nom">Non konplè</label>
          <input
            type="text"
            id="nom"
            placeholder="Antre non ou"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Imèl</label>
          <input
            type="email"
            id="email"
            placeholder="Antre imèl ou"
            required
          >
            </div>
                    <div class="form-group">
          <label for="email">Imèl</label>
          <input
            type="email"
            id="email"
            placeholder="Antre imèl ou"
            required
          >
                    </div>
                            <div class="form-group">
          <label for="telephone">Telefòn</label>
          <input
            type="tel"
            id="telephone"
            placeholder="Antre nimewo telefòn ou"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Modpas</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Kreye yon modpas"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Konfime modpas</label>

          <div class="password-box">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Konfime modpas ou"
              required
            >

            <button
              type="button"
              id="toggleConfirmPassword"
              class="password-toggle"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Mwen vle</label>

          <select id="role" required>
            <option value="">Chwazi kalite kont</option>
            <option value="acheteur">Achte sou Macheya</option>
            <option value="vendeur">Vann sou Macheya</option>
          </select>
        </div>

        <div id="signupMessage" class="message"></div>

        <button
          type="submit"
          id="signupButton"
          class="auth-button"
        >
          Kreye Kont
  </button>
        </form>

      <p class="auth-footer">
        Ou deja gen yon kont?
        <a href="login.html">Konekte</a>
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
                                      </html>
