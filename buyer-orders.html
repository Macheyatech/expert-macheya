<!DOCTYPE html>
<html lang="ht">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Macheya | Kòmand mwen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #171717;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 16px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .back {
            color: #555;
            text-decoration: none;
        }

        .logo {
            text-decoration: none;
            color: #111;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-mark {
            display: inline-grid;
            place-items: center;
            width: 35px;
            height: 35px;
            margin-right: 7px;
            border-radius: 50%;
            background: #f97316;
            color: white;
        }

        main {
            width: min(900px, 92%);
            margin: 35px auto 60px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading span {
            color: #f97316;
            font-weight: 700;
        }

        .heading h1 {
            margin: 8px 0;
            font-size: 30px;
        }

        .heading p {
            color: #666;
        }

        #orders-message {
            margin: 20px 0;
            color: #777;
        }

        #orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 25px rgba(0,0,0,.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .order-product {
            font-size: 20px;
            font-weight: 700;
        }

        .order-status {
            padding: 6px 11px;
            border-radius: 20px;
            background: #eee;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .order-info {
            display: grid;
            gap: 9px;
            color: #555;
            margin-bottom: 18px;
        }

        .order-info strong {
            color: #222;
        }

        .order-actions button {
            border: 0;
            border-radius: 9px;
            padding: 12px 16px;
            background: #f97316;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .order-actions button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .delivery-warning {
            margin: 12px 0;
            padding: 11px;
            border-radius: 9px;
            background: #fff4e8;
            color: #9a4d00;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .order-top {
                flex-direction: column;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>

    <a class="back" href="buyer.html">
        ← Retounen
    </a>

    <a class="logo" href="index.html">
        <span class="logo-mark">M</span>
        macheya
    </a>

</header>

<main>

    <section class="heading">

        <span>🛍️ ESPAS ACHETÈ</span>

        <h1>Kòmand mwen</h1>

        <p>
            Swiv kòmand ou yo epi konfime lè ou resevwa pwodwi a.
        </p>

    </section>

    <div id="orders-message">
        Ap chaje kòmand yo...
    </div>

    <section id="orders-list"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="buyer-orders.js"></script>

</body>
  </html>
