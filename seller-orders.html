<!DOCTYPE html>
<html lang="ht">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Macheya | Kòmand Vandè</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #171717;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 16px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            text-decoration: none;
            color: #111;
            font-size: 22px;
            font-weight: 700;
        }

        .logo-mark {
            display: inline-grid;
            place-items: center;
            width: 35px;
            height: 35px;
            margin-right: 7px;
            border-radius: 50%;
            background: #f97316;
            color: white;
        }

        .back {
            color: #555;
            text-decoration: none;
        }

        main {
            width: min(900px, 92%);
            margin: 35px auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading span {
            color: #f97316;
            font-weight: 700;
        }

        .heading h1 {
            margin: 8px 0;
            font-size: 30px;
        }

        .heading p {
            color: #666;
        }

        #orders-message {
            margin: 20px 0;
            color: #777;
        }

        #orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 25px rgba(0,0,0,.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .order-product {
            font-size: 20px;
            font-weight: 700;
        }

        .order-status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #eee;
            font-size: 13px;
            font-weight: 700;
        }

        .order-info {
            display: grid;
            gap: 8px;
            color: #555;
            margin-bottom: 18px;
        }

        .order-info strong {
            color: #222;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .order-actions button {
            border: 0;
            border-radius: 9px;
            padding: 12px 15px;
            cursor: pointer;
            font-weight: 700;
        }

        .confirm {
            background: #f97316;
            color: white;
        }

        .deliver {
            background: #222;
            color: white;
        }

        .disabled {
            opacity: .5;
            cursor: not-allowed !important;
        }

        @media (max-width: 600px) {
            .order-top {
                flex-direction: column;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>


<body>

<header>

    <a
        class="back"
        href="seller.html"
    >
        ← Retounen
    </a>

    <a
        class="logo"
        href="index.html"
    >
        <span class="logo-mark">M</span>
        macheya
    </a>

</header>


<main>

    <section class="heading">

        <span>🏪 ESPAS VANDÈ</span>

        <h1>Kòmand kliyan yo</h1>

        <p>
            Wè kòmand yo, konfime pwodwi ki disponib,
            epi make kòmand lan kòm livre lè li ale.
        </p>

    </section>


    <div id="orders-message">
        Ap chaje kòmand yo...
    </div>


    <section id="orders-list"></section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="seller-orders.js"></script>

</body>

  </html>
