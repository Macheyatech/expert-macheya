<!DOCTYPE html>
<html lang="ht">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Pwofil mwen sou macheya."
    >

    <title>Pwofil mwen | macheya</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f7f7f7;
            color: #171717;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .profile-header {
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            padding: 15px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 21px;
            font-weight: 700;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f97316;
            color: #ffffff;
            display: grid;
            place-items: center;
            font-weight: 700;
        }

        .back-button {
            color: #555555;
            font-size: 14px;
            font-weight: 600;
        }

        .profile-container {
            width: min(700px, 92%);
            margin: 35px auto 70px;
        }

        .profile-heading {
            margin-bottom: 25px;
        }

        .profile-label {
            color: #f97316;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .profile-heading h1 {
            margin: 7px 0;
            font-size: 30px;
        }

        .profile-heading p {
            color: #777777;
            font-size: 14px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .profile-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #fff1e8;
            color: #f97316;
            display: grid;
            place-items: center;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .profile-email {
            color: #777777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .profile-info {
            display: grid;
            gap: 13px;
        }

        .info-box {
            background: #f8f8f8;
            border-radius: 14px;
            padding: 16px;
        }

        .info-box span {
            display: block;
            color: #888888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 15px;
            word-break: break-word;
        }

        .profile-message {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            color: #666666;
        }

        .message-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .main-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 10px;
            background: #f97316;
            color: #ffffff;
            font-weight: 700;
        }

        @media (max-width: 430px) {

            .profile-header {
                padding: 14px 5%;
            }

            .brand {
                font-size: 19px;
            }

            .logo {
                width: 35px;
                height: 35px;
            }

            .back-button {
                font-size: 12px;
            }

            .profile-container {
                margin-top: 25px;
            }

            .profile-heading h1 {
                font-size: 26px;
            }

            .profile-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header class="profile-header">

    <a
        href="dashboard.html"
        class="brand"
    >

        <span class="logo">
            M
        </span>

        <span>
            macheya
        </span>

    </a>


    <a
        href="dashboard.html"
        class="back-button"
    >
        ← Dashboard
    </a>

</header>


<main class="profile-container">


    <section class="profile-heading">

        <span class="profile-label">
            ESPAS ACHTÈ
        </span>

        <h1>
            Pwofil mwen
        </h1>

        <p>
            Jere enfòmasyon kont ou sou macheya.
        </p>

    </section>


    <section
        id="profileMessage"
        class="profile-message"
    >

        <div class="message-icon">
            👤
        </div>

        <p>
            Ap chaje pwofil ou...
        </p>

    </section>


    <section
        id="profileCard"
        class="profile-card"
        hidden
    >

        <div
            id="profileAvatar"
            class="profile-avatar"
        >
            M
        </div>


        <div
            id="profileName"
            class="profile-name"
        >
            —
        </div>


        <div
            id="profileEmail"
            class="profile-email"
        >
            —
        </div>


        <div class="profile-info">

            <div class="info-box">

                <span>
                    Non konplè
                </span>

                <strong id="profileFullName">
                    —
                </strong>

            </div>


            <div class="info-box">

                <span>
                    Telefòn
                </span>

                <strong id="profilePhone">
                    —
                </strong>

            </div>

        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

.auth.getUser();
    
<script>

(function () {

    "use strict";

    const supabase =
        window.supabaseClient;

    const message =
        document.getElementById("profileMessage");

    const card =
        document.getElementById("profileCard");

    const avatar =
        document.getElementById("profileAvatar");

    const profileName =
        document.getElementById("profileName");

    const profileEmail =
        document.getElementById("profileEmail");

    const fullName =
        document.getElementById("profileFullName");

    const phone =
        document.getElementById("profilePhone");


    function showMessage(icon, text) {

        if (!message) return;

        message.hidden = false;

        message.innerHTML = `
            <div class="message-icon">
                ${icon}
            </div>

            <p>
                ${text}
            </p>

            <a
                href="dashboard.html"
                class="main-button"
            >
                Retounen Dashboard
            </a>
        `;

    }


    function showProfile(user, profile) {

        const metadata =
            user.user_metadata || {};


        const displayName =
            profile?.name ||
            profile?.full_name ||
            profile?.nom_complet ||
            metadata.name ||
            metadata.full_name ||
            metadata.nom_complet ||
            "Achtè macheya";


        const displayFullName =
            profile?.full_name ||
            profile?.nom_complet ||
            profile?.name ||
            metadata.full_name ||
            metadata.nom_complet ||
            metadata.name ||
            "—";


        const displayPhone =
            profile?.phone ||
            metadata.phone ||
            metadata.telephone ||
            "—";


        if (avatar) {

            avatar.textContent =
                displayName
                    .charAt(0)
                    .toUpperCase();

        }


        if (profileName) {

            profileName.textContent =
                displayName;

        }


        if (profileEmail) {

            profileEmail.textContent =
                user.email || "—";

        }


        if (fullName) {

            fullName.textContent =
                displayFullName;

        }


        if (phone) {

            phone.textContent =
                displayPhone;

        }


        if (message) {

            message.hidden = true;

        }


        if (card) {

            card.hidden = false;

        }

    }


    async function loadProfile() {

        if (!supabase) {

            showMessage(
                "⚠️",
                "Macheya pa kapab konekte ak bazdone a."
            );

            return;

        }


        const {
            data: auth,
            error: authError
        } =
            await supabase.auth.getUser();


        if (
            authError ||
            !auth?.user
        ) {

            location.href =
                "login.html";

            return;

        }


        const user =
            auth.user;


        let profile = null;


        /*
         * Nou itilize select("*")
         * pou evite pwoblèm si non
         * kolòn yo diferan.
         */

        const {
            data,
            error
        } =
            await supabase
                .from("profiles")
                .select("*")
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (error) {

            console.error(
                "Macheya Profile Error:",
                error
            );

        } else {

            profile = data;

        }


        /*
         * Menm si profiles pa gen
         * done oswa RLS bloke li,
         * nou toujou montre enfòmasyon
         * ki soti nan kont Supabase la.
         */

        showProfile(
            user,
            profile
        );

    }


    loadProfile();


})();

</script>


        

</body>

  </html>
